<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="42%" cy="32%" r="78%">
      <stop offset="0%"   stop-color="#1E0A38"/>
      <stop offset="55%"  stop-color="#0D1040"/>
      <stop offset="100%" stop-color="#060914"/>
    </radialGradient>
    <linearGradient id="vg" x1="256" y1="72" x2="256" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFE04B"/>
      <stop offset="38%"  stop-color="#FF8C1A"/>
      <stop offset="72%"  stop-color="#FF4D5E"/>
      <stop offset="100%" stop-color="#E0266A"/>
    </linearGradient>
    <linearGradient id="shine" x1="256" y1="72" x2="256" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="white" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="bloom" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="node-glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFE04B"/>
      <stop offset="30%"  stop-color="#FF8C1A" stop-opacity="0.8"/>
      <stop offset="70%"  stop-color="#E0266A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E0266A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo sin bordes (safe zone maskable) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Anillos sonar -->
  <circle cx="256" cy="410" r="55"  fill="none" stroke="#7C3AED" stroke-width="0.7" opacity="0.28"/>
  <circle cx="256" cy="410" r="115" fill="none" stroke="#7C3AED" stroke-width="0.6" opacity="0.18"/>
  <circle cx="256" cy="410" r="195" fill="none" stroke="#5B21B6" stroke-width="0.5" opacity="0.12"/>
  <circle cx="256" cy="410" r="285" fill="none" stroke="#4C1D95" stroke-width="0.4" opacity="0.07"/>

  <!-- Estrellas -->
  <circle cx="74"  cy="78"  r="1.5" fill="white" opacity="0.38"/>
  <circle cx="422" cy="62"  r="2"   fill="white" opacity="0.28"/>
  <circle cx="462" cy="205" r="1.5" fill="white" opacity="0.22"/>
  <circle cx="52"  cy="315" r="1.2" fill="white" opacity="0.28"/>
  <circle cx="318" cy="82"  r="1.2" fill="#FFD166" opacity="0.45"/>
  <circle cx="192" cy="68"  r="1"   fill="#FF9130" opacity="0.35"/>

  <!-- Bloom -->
  <path d="M 102,72 C 132,200 205,320 256,410 C 232,320 186,200 164,72 Z"
        fill="#FF8C1A" opacity="0.40" filter="url(#bloom)"/>
  <path d="M 410,72 C 380,200 307,320 256,410 C 280,320 326,200 348,72 Z"
        fill="#FF8C1A" opacity="0.40" filter="url(#bloom)"/>

  <!-- Brazo izquierdo -->
  <path d="M 102,72 C 132,200 205,320 256,410 C 232,320 186,200 164,72 Z"
        fill="url(#vg)" filter="url(#glow)"/>
  <path d="M 102,72 C 132,200 205,320 256,410 C 250,406 102,78 102,72 Z"
        fill="url(#shine)"/>

  <!-- Brazo derecho -->
  <path d="M 410,72 C 380,200 307,320 256,410 C 280,320 326,200 348,72 Z"
        fill="url(#vg)" filter="url(#glow)"/>
  <path d="M 410,72 C 380,200 307,320 256,410 C 262,406 410,78 410,72 Z"
        fill="url(#shine)"/>

  <!-- Punta convergencia -->
  <circle cx="256" cy="410" r="55" fill="url(#burst)"/>
  <circle cx="256" cy="410" r="18" fill="#FFE04B" filter="url(#node-glow)"/>
  <circle cx="256" cy="410" r="10" fill="white" opacity="0.95"/>

  <!-- Lens flare -->
  <ellipse cx="256" cy="410" rx="1.2" ry="30" fill="white" opacity="0.22"/>
  <ellipse cx="256" cy="410" rx="26"  ry="1.2" fill="white" opacity="0.22"/>
  <ellipse cx="256" cy="410" rx="0.8" ry="20" fill="white" opacity="0.12" transform="rotate(45 256 410)"/>
  <ellipse cx="256" cy="410" rx="0.8" ry="20" fill="white" opacity="0.12" transform="rotate(-45 256 410)"/>

</svg>
