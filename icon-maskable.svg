<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="38%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#0d2461"/>
      <stop offset="100%" stop-color="#040c1e"/>
    </radialGradient>
    <linearGradient id="vein-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="vein-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="node" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pulse-glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo sin bordes redondeados (maskable safe zone) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Anillos decorativos -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#1e3a7a" stroke-width="0.8" opacity="0.35"/>

  <!-- Halo difuso -->
  <path d="M 158 108 C 178 205, 215 305, 256 400" fill="none" stroke="#3b82f6" stroke-width="44" stroke-linecap="round" opacity="0.07"/>
  <path d="M 354 108 C 334 205, 297 305, 256 400" fill="none" stroke="#3b82f6" stroke-width="44" stroke-linecap="round" opacity="0.07"/>

  <!-- Sombra base -->
  <path d="M 158 108 C 178 205, 215 305, 256 400" fill="none" stroke="#1e3a8a" stroke-width="22" stroke-linecap="round"/>
  <path d="M 354 108 C 334 205, 297 305, 256 400" fill="none" stroke="#1e3a8a" stroke-width="22" stroke-linecap="round"/>

  <!-- Vasos principales -->
  <path d="M 158 108 C 178 205, 215 305, 256 400" fill="none" stroke="url(#vein-l)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 158 108 C 178 205, 215 305, 256 400" fill="none" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <path d="M 354 108 C 334 205, 297 305, 256 400" fill="none" stroke="url(#vein-r)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 354 108 C 334 205, 297 305, 256 400" fill="none" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round" opacity="0.45"/>

  <!-- Ramificaciones izquierda -->
  <path d="M 168 172 Q 122 152 98 168" fill="none" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" opacity="0.5" filter="url(#glow)"/>
  <path d="M 168 172 Q 140 125 130 100" fill="none" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round" opacity="0.38"/>
  <path d="M 182 228 Q 138 236 110 258" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" opacity="0.42"/>
  <path d="M 198 290 Q 158 302 130 290" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" opacity="0.32"/>

  <!-- Ramificaciones derecha -->
  <path d="M 344 172 Q 390 152 414 168" fill="none" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" opacity="0.5" filter="url(#glow)"/>
  <path d="M 344 172 Q 372 125 382 100" fill="none" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round" opacity="0.38"/>
  <path d="M 330 228 Q 374 236 402 258" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" opacity="0.42"/>
  <path d="M 314 290 Q 354 302 382 290" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" opacity="0.32"/>

  <!-- Nodo punta de la V -->
  <circle cx="256" cy="400" r="24" fill="#1d4ed8" opacity="0.6" filter="url(#bigglow)"/>
  <circle cx="256" cy="400" r="16" fill="#2563eb" filter="url(#glow)"/>
  <circle cx="256" cy="400" r="9" fill="url(#node)"/>

  <!-- Pulso cardíaco -->
  <path d="M 62 458 L 140 458 L 162 436 L 182 480 L 204 422 L 224 458 L 254 458 M 258 458 L 290 458 L 310 470 L 332 444 L 350 458 L 450 458"
        fill="none" stroke="#f472b6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
        opacity="0.8" filter="url(#pulse-glow)"/>

  <!-- Células sutiles -->
  <circle cx="185" cy="148" r="3" fill="#93c5fd" opacity="0.5"/>
  <circle cx="204" cy="200" r="2.5" fill="#93c5fd" opacity="0.4"/>
  <circle cx="226" cy="260" r="2" fill="#93c5fd" opacity="0.35"/>
  <circle cx="327" cy="148" r="3" fill="#93c5fd" opacity="0.5"/>
  <circle cx="308" cy="200" r="2.5" fill="#93c5fd" opacity="0.4"/>
  <circle cx="286" cy="260" r="2" fill="#93c5fd" opacity="0.35"/>
</svg>
