<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>

    <!-- Fondo: morado marca → azul noche → negro -->
    <radialGradient id="bg" cx="44%" cy="30%" r="80%">
      <stop offset="0%"   stop-color="#2A1590"/>
      <stop offset="50%"  stop-color="#0E0A3A"/>
      <stop offset="100%" stop-color="#030308"/>
    </radialGradient>

    <!-- V: lima → azul → violeta (colores de marca) -->
    <linearGradient id="vg" x1="256" y1="52" x2="256" y2="422" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#80FF59"/>
      <stop offset="42%"  stop-color="#348FFF"/>
      <stop offset="100%" stop-color="#8B76FF"/>
    </linearGradient>

    <!-- Reflejo/shine -->
    <linearGradient id="shine" x1="256" y1="52" x2="256" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="white" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Bloom detrás de la V (reducido) -->
    <filter id="bloom" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <!-- Glow suave en la punta -->
    <filter id="node-glow" x="-130%" y="-130%" width="360%" height="360%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Burst radial en la convergencia -->
    <radialGradient id="burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#80FF59"/>
      <stop offset="28%"  stop-color="#13C059" stop-opacity="0.75"/>
      <stop offset="65%"  stop-color="#348FFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8B76FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Halo sutil de fondo alrededor de la V -->
    <linearGradient id="halo" x1="256" y1="52" x2="256" y2="422" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#80FF59" stop-opacity="0.45"/>
      <stop offset="50%"  stop-color="#348FFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8B76FF" stop-opacity="0.20"/>
    </linearGradient>

  </defs>

  <!-- ── FONDO ── -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Anillos de sonar centrados en la punta de la V -->
  <circle cx="256" cy="422" r="52"  fill="none" stroke="#8B76FF" stroke-width="0.8" opacity="0.30"/>
  <circle cx="256" cy="422" r="110" fill="none" stroke="#348FFF" stroke-width="0.6" opacity="0.20"/>
  <circle cx="256" cy="422" r="188" fill="none" stroke="#13C059" stroke-width="0.5" opacity="0.13"/>
  <circle cx="256" cy="422" r="278" fill="none" stroke="#80FF59" stroke-width="0.4" opacity="0.07"/>

  <!-- Partículas/estrellas en el fondo -->
  <circle cx="72"  cy="76"  r="1.5" fill="#80FF59"  opacity="0.50"/>
  <circle cx="420" cy="60"  r="1.8" fill="white"    opacity="0.30"/>
  <circle cx="464" cy="208" r="1.2" fill="#348FFF"  opacity="0.45"/>
  <circle cx="50"  cy="318" r="1.5" fill="white"    opacity="0.25"/>
  <circle cx="476" cy="374" r="1.2" fill="#8B76FF"  opacity="0.35"/>
  <circle cx="150" cy="464" r="1"   fill="white"    opacity="0.20"/>
  <circle cx="386" cy="454" r="1.5" fill="#80FF59"  opacity="0.30"/>
  <circle cx="316" cy="80"  r="1.2" fill="#13C059"  opacity="0.40"/>
  <circle cx="190" cy="66"  r="1"   fill="#348FFF"  opacity="0.38"/>
  <circle cx="442" cy="132" r="1"   fill="#8B76FF"  opacity="0.32"/>
  <circle cx="66"  cy="192" r="1.2" fill="#80FF59"  opacity="0.28"/>
  <circle cx="400" cy="300" r="1"   fill="white"    opacity="0.18"/>
  <circle cx="108" cy="400" r="1"   fill="#348FFF"  opacity="0.20"/>

  <!-- ── BLOOM (halo cálido y colorido detrás de la V) ── -->
  <path d="M 84,52 C 118,192 196,330 256,422 C 230,330 182,192 158,52 Z"
        fill="url(#halo)" filter="url(#bloom)"/>
  <path d="M 428,52 C 394,192 316,330 256,422 C 282,330 330,192 354,52 Z"
        fill="url(#halo)" filter="url(#bloom)"/>

  <!-- ── BRAZO IZQUIERDO (forma cónica rellena) ── -->
  <path d="M 84,52 C 118,192 196,330 256,422 C 230,330 182,192 158,52 Z"
        fill="url(#vg)" />
  <!-- Shine exterior izquierdo -->
  <path d="M 84,52 C 118,192 196,330 254,420 C 252,418 84,58 84,52 Z"
        fill="url(#shine)"/>

  <!-- ── BRAZO DERECHO (forma cónica rellena) ── -->
  <path d="M 428,52 C 394,192 316,330 256,422 C 282,330 330,192 354,52 Z"
        fill="url(#vg)" />
  <!-- Shine exterior derecho -->
  <path d="M 428,52 C 394,192 316,330 258,420 C 260,418 428,58 428,52 Z"
        fill="url(#shine)"/>

  <!-- ── CONVERGENCIA ── -->
  <!-- Burst de luz en la punta -->
  <circle cx="256" cy="422" r="62" fill="url(#burst)"/>
  <!-- Anillo brillante -->
  <circle cx="256" cy="422" r="22" fill="#80FF59" filter="url(#node-glow)"/>
  <!-- Punto blanco central -->
  <circle cx="256" cy="422" r="11" fill="white" opacity="0.96"/>

  <!-- Lens flare artístico -->
  <ellipse cx="256" cy="422" rx="1.2" ry="34" fill="white" opacity="0.20"/>
  <ellipse cx="256" cy="422" rx="30"  ry="1.2" fill="white" opacity="0.20"/>
  <ellipse cx="256" cy="422" rx="0.8" ry="22"  fill="white" opacity="0.11" transform="rotate(45 256 422)"/>
  <ellipse cx="256" cy="422" rx="0.8" ry="22"  fill="white" opacity="0.11" transform="rotate(-45 256 422)"/>

</svg>
