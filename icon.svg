<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="38%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#0d2461"/>
      <stop offset="100%" stop-color="#040c1e"/>
    </radialGradient>
    <linearGradient id="vein-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="vein-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="node" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pulse-glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Anillos decorativos sutiles -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#1e3a7a" stroke-width="0.8" opacity="0.35"/>
  <circle cx="256" cy="256" r="245" fill="none" stroke="#1e3a7a" stroke-width="0.5" opacity="0.18"/>

  <!-- Halo difuso detrás de la V -->
  <path d="M 138 88 C 158 195, 205 305, 256 408" fill="none" stroke="#3b82f6" stroke-width="50" stroke-linecap="round" opacity="0.07"/>
  <path d="M 374 88 C 354 195, 307 305, 256 408" fill="none" stroke="#3b82f6" stroke-width="50" stroke-linecap="round" opacity="0.07"/>

  <!-- Sombra base de los vasos -->
  <path d="M 138 88 C 158 195, 205 305, 256 408" fill="none" stroke="#1e3a8a" stroke-width="24" stroke-linecap="round"/>
  <path d="M 374 88 C 354 195, 307 305, 256 408" fill="none" stroke="#1e3a8a" stroke-width="24" stroke-linecap="round"/>

  <!-- Vasos principales izquierdo -->
  <path d="M 138 88 C 158 195, 205 305, 256 408" fill="none" stroke="url(#vein-l)" stroke-width="15" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 138 88 C 158 195, 205 305, 256 408" fill="none" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

  <!-- Vasos principales derecho -->
  <path d="M 374 88 C 354 195, 307 305, 256 408" fill="none" stroke="url(#vein-r)" stroke-width="15" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 374 88 C 354 195, 307 305, 256 408" fill="none" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

  <!-- Ramificaciones izquierda -->
  <path d="M 150 162 Q 98 142 72 158" fill="none" stroke="#60a5fa" stroke-width="5.5" stroke-linecap="round" opacity="0.55" filter="url(#glow)"/>
  <path d="M 148 162 Q 118 110 108 82" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <path d="M 165 218 Q 116 224 86 248" fill="none" stroke="#60a5fa" stroke-width="4.5" stroke-linecap="round" opacity="0.45"/>
  <path d="M 165 218 Q 132 196 128 168" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M 184 282 Q 140 294 112 280" fill="none" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Ramificaciones derecha -->
  <path d="M 362 162 Q 414 142 440 158" fill="none" stroke="#60a5fa" stroke-width="5.5" stroke-linecap="round" opacity="0.55" filter="url(#glow)"/>
  <path d="M 364 162 Q 394 110 404 82" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <path d="M 347 218 Q 396 224 426 248" fill="none" stroke="#60a5fa" stroke-width="4.5" stroke-linecap="round" opacity="0.45"/>
  <path d="M 347 218 Q 380 196 384 168" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M 328 282 Q 372 294 400 280" fill="none" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Nodo central (punta de la V) -->
  <circle cx="256" cy="408" r="26" fill="#1d4ed8" opacity="0.6" filter="url(#bigglow)"/>
  <circle cx="256" cy="408" r="18" fill="#2563eb" filter="url(#glow)"/>
  <circle cx="256" cy="408" r="11" fill="url(#node)"/>

  <!-- Línea de pulso cardíaco -->
  <path d="M 52 464 L 138 464 L 160 440 L 180 488 L 202 424 L 222 464 L 254 464 M 258 464 L 290 464 L 310 476 L 332 448 L 350 464 L 460 464"
        fill="none" stroke="#f472b6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
        opacity="0.8" filter="url(#pulse-glow)"/>

  <!-- Puntos sutiles (células) -->
  <circle cx="175" cy="135" r="3" fill="#93c5fd" opacity="0.5"/>
  <circle cx="196" cy="188" r="2.5" fill="#93c5fd" opacity="0.4"/>
  <circle cx="218" cy="252" r="2" fill="#93c5fd" opacity="0.35"/>
  <circle cx="337" cy="135" r="3" fill="#93c5fd" opacity="0.5"/>
  <circle cx="316" cy="188" r="2.5" fill="#93c5fd" opacity="0.4"/>
  <circle cx="294" cy="252" r="2" fill="#93c5fd" opacity="0.35"/>
</svg>
