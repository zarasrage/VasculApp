<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>

    <!-- Fondo: morado profundo a azul noche -->
    <radialGradient id="bg" cx="42%" cy="32%" r="78%">
      <stop offset="0%"   stop-color="#1E0A38"/>
      <stop offset="55%"  stop-color="#0D1040"/>
      <stop offset="100%" stop-color="#060914"/>
    </radialGradient>

    <!-- V: amarillo-dorado → naranja → coral-rosa -->
    <linearGradient id="vg" x1="256" y1="52" x2="256" y2="422" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFE04B"/>
      <stop offset="38%"  stop-color="#FF8C1A"/>
      <stop offset="72%"  stop-color="#FF4D5E"/>
      <stop offset="100%" stop-color="#E0266A"/>
    </linearGradient>

    <!-- Brillo/reflejo superior de los brazos -->
    <linearGradient id="shine" x1="256" y1="52" x2="256" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="white" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Bloom: resplandor suave y cálido detrás de la V -->
    <filter id="bloom" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <!-- Glow: halo medio en los bordes del brazo -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow intenso para el punto de convergencia -->
    <filter id="node-glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Burst radial en la punta de la V -->
    <radialGradient id="burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFE04B"/>
      <stop offset="30%"  stop-color="#FF8C1A" stop-opacity="0.8"/>
      <stop offset="70%"  stop-color="#E0266A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E0266A" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- ── FONDO ── -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Anillos sutiles centrados en la punta de la V (efecto sonar) -->
  <circle cx="256" cy="422" r="55"  fill="none" stroke="#7C3AED" stroke-width="0.7" opacity="0.28"/>
  <circle cx="256" cy="422" r="115" fill="none" stroke="#7C3AED" stroke-width="0.6" opacity="0.18"/>
  <circle cx="256" cy="422" r="195" fill="none" stroke="#5B21B6" stroke-width="0.5" opacity="0.12"/>
  <circle cx="256" cy="422" r="285" fill="none" stroke="#4C1D95" stroke-width="0.4" opacity="0.07"/>

  <!-- Estrellas/partículas en el fondo -->
  <circle cx="74"  cy="78"  r="1.5" fill="white" opacity="0.38"/>
  <circle cx="422" cy="62"  r="2"   fill="white" opacity="0.28"/>
  <circle cx="462" cy="205" r="1.5" fill="white" opacity="0.22"/>
  <circle cx="52"  cy="315" r="1.2" fill="white" opacity="0.28"/>
  <circle cx="478" cy="375" r="1.5" fill="white" opacity="0.18"/>
  <circle cx="148" cy="462" r="1"   fill="white" opacity="0.22"/>
  <circle cx="388" cy="452" r="1.5" fill="white" opacity="0.18"/>
  <circle cx="318" cy="82"  r="1.2" fill="#FFD166" opacity="0.45"/>
  <circle cx="192" cy="68"  r="1"   fill="#FF9130" opacity="0.35"/>
  <circle cx="440" cy="130" r="1"   fill="#C084FC" opacity="0.3"/>
  <circle cx="68"  cy="190" r="1.2" fill="#C084FC" opacity="0.25"/>

  <!-- ── BLOOM (resplandor cálido detrás de la V) ── -->
  <path d="M 84,52 C 118,192 196,330 256,422 C 230,330 182,192 158,52 Z"
        fill="#FF8C1A" opacity="0.40" filter="url(#bloom)"/>
  <path d="M 428,52 C 394,192 316,330 256,422 C 282,330 330,192 354,52 Z"
        fill="#FF8C1A" opacity="0.40" filter="url(#bloom)"/>

  <!-- ── BRAZO IZQUIERDO ── -->
  <!-- Forma cónica rellena: ancha arriba (84→159), punta abajo (256,422) -->
  <path d="M 84,52 C 118,192 196,330 256,422 C 230,330 182,192 158,52 Z"
        fill="url(#vg)" filter="url(#glow)"/>
  <!-- Reflejo/shine en el borde exterior izquierdo -->
  <path d="M 84,52 C 118,192 196,330 256,422 C 248,418 84,58 84,52 Z"
        fill="url(#shine)"/>

  <!-- ── BRAZO DERECHO ── -->
  <path d="M 428,52 C 394,192 316,330 256,422 C 282,330 330,192 354,52 Z"
        fill="url(#vg)" filter="url(#glow)"/>
  <!-- Reflejo/shine en el borde exterior derecho -->
  <path d="M 428,52 C 394,192 316,330 256,422 C 264,418 428,58 428,52 Z"
        fill="url(#shine)"/>

  <!-- ── PUNTA DE LA V ── -->
  <!-- Burst de luz -->
  <circle cx="256" cy="422" r="58" fill="url(#burst)"/>
  <!-- Punto central brillante -->
  <circle cx="256" cy="422" r="20" fill="#FFE04B" filter="url(#node-glow)"/>
  <circle cx="256" cy="422" r="11" fill="white" opacity="0.95"/>

  <!-- Destellos de lente (lens flare artístico) -->
  <ellipse cx="256" cy="422" rx="1.2" ry="32" fill="white" opacity="0.22"/>
  <ellipse cx="256" cy="422" rx="28" ry="1.2" fill="white" opacity="0.22"/>
  <ellipse cx="256" cy="422" rx="0.8" ry="22" fill="white" opacity="0.12" transform="rotate(45 256 422)"/>
  <ellipse cx="256" cy="422" rx="0.8" ry="22" fill="white" opacity="0.12" transform="rotate(-45 256 422)"/>

</svg>
